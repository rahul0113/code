name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint src/lib/claude/ src/plugins/claude/www/ tests/unit/claude/ --max-warnings 0 || true

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify plugin structure
        run: |
          echo "Checking Claude plugin files..."
          test -f src/plugins/claude/plugin.xml || exit 1
          test -f src/plugins/claude/package.json || exit 1
          test -f src/plugins/claude/www/Claude.js || exit 1
          test -f src/plugins/claude/src/android/ClaudePlugin.java || exit 1
          echo "All plugin files present."

      - name: Verify test files
        run: |
          echo "Checking test files..."
          test -f tests/unit/claude/cliParser.test.js || exit 1
          test -f tests/unit/claude/storage.test.js || exit 1
          test -f tests/unit/claude/settings.test.js || exit 1
          echo "All test files present."
