name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx biome check src/ai/ src/sidebarApps/ai/ src/lib/claude/ tests/

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose || true

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify plugin structure
        run: |
          echo "Checking Claude plugin files..."
          test -f src/plugins/claude/plugin.xml || exit 1
          test -f src/plugins/claude/package.json || exit 1
          test -f src/plugins/claude/www/Claude.js || exit 1
          test -f src/plugins/claude/src/android/ClaudePlugin.java || exit 1
          echo "All plugin files present."

      - name: Verify test files
        run: |
          echo "Checking test files..."
          test -f tests/unit/claude/cliParser.test.js || exit 1
          test -f tests/unit/claude/storage.test.js || exit 1
          test -f tests/unit/claude/settings.test.js || exit 1
          echo "All test files present."

  build-apk:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acode-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
